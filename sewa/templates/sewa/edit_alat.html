{% extends 'sewa/base.html' %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h6 class="fw-bold m-0">Edit Data Alat</h6>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nama Alat</label>
                        <input type="text" name="nama_alat" value="{{ alat.nama_alat }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kategori</label>
                        <input type="text" name="kategori" value="{{ alat.kategori }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Harga Sewa / Hari</label>
                        <input type="number" name="harga_sewa" value="{{ alat.harga_sewa }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Stok</label>
                        <input type="number" name="stok" value="{{ alat.stok }}" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Foto Alat (Kosongkan jika tidak diganti)</label>
                        {% if alat.foto %}
                            <div class="mb-2">
                                <img src="{{ alat.foto.url }}" width="80" class="rounded border">
                            </div>
                        {% endif %}
                        <input type="file" name="foto" class="form-control" accept="image/*">
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary w-100 fw-bold">Batal</a>
                        </div>
                        <div class="col-6">
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
